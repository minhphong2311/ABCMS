<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CMS Site Builder{% endblock %}</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Theme style (AdminLTE) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.7.12/sweetalert2.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dark-mode.css') }}">
  {% block style %}{% endblock %}
</head>
<body class="hold-transition layout-top-nav">
<script>
  // Prevent FOUC (Flash of Unstyled Content) in Dark Mode
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
  }
</script>
<div class="wrapper">

  <!-- Navbar -->
  <nav class="main-header navbar navbar-expand-md navbar-light navbar-white" id="main-navbar">
    <script>
      if (localStorage.getItem('theme') === 'dark') {
        var nav = document.getElementById('main-navbar');
        nav.classList.remove('navbar-white', 'navbar-light');
        nav.classList.add('navbar-dark');
      }
    </script>
    <div class="container-fluid">
      <a href="/" class="navbar-brand d-flex align-items-center py-0" style="margin-right: 1.5rem;">
        <span class="brand-text font-weight-bold" style="background: linear-gradient(135deg, #00aeef, #8cc63f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.65rem; line-height: 1.2;">ABCMS</span>
      </a>

      <button class="navbar-toggler order-1" type="button" data-toggle="collapse" data-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse order-3" id="navbarCollapse">
        <!-- Left navbar links -->
        <ul class="navbar-nav">
          <!-- Removed Home link -->
        </ul>

        <!-- Right navbar links -->
        <ul class="navbar-nav ml-auto">
          <li class="nav-item d-flex align-items-center">
            <div class="theme-switch-wrapper nav-link">
              <label class="theme-switch" for="checkbox">
                <input type="checkbox" id="checkbox">
                <span class="slider round"></span>
              </label>
            </div>
          </li>
          <li class="nav-item">
            <a href="/settings" class="nav-link" title="System Settings"><i class="fas fa-cog" style="font-size: 1.25rem;"></i></a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <!-- /.navbar -->

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">

    <!-- Main content -->
    <section class="content py-3">
      <div class="container-fluid">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <script>
              document.addEventListener('DOMContentLoaded', function() {
                {% for category, message in messages %}
                  {% set icon = 'success' if category == 'success' else ('error' if category == 'danger' or category == 'error' else 'info') %}
                  Swal.fire({
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 3000,
                    icon: '{{ icon }}',
                    title: {{ message | tojson }}
                  });
                {% endfor %}
              });
            </script>
          {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
      </div>
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->

  <footer class="main-footer">
    <div class="float-right d-none d-sm-block">
      <b>Version</b> 1.0.0
    </div>
    <strong>Copyright &copy; 2026.</strong> All rights reserved.
  </footer>
</div>
<!-- ./wrapper -->

<!-- jQuery -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<!-- Bootstrap 4 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.1/js/bootstrap.bundle.min.js"></script>
<!-- AdminLTE App -->
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<!-- SweetAlert2 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.7.12/sweetalert2.all.min.js"></script>
<script src="{{ url_for('static', filename='js/dark-mode.js') }}"></script>
{% block script %}{% endblock %}
</body>
</html>
