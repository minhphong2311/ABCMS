        <div class="lc-block toggled" id="l-login">

			<div ng-show="login.step == 1">

				<input type="hidden" ng-model="login.url" name="url" ng-init="login.url = '/_fox/index.do?siteId=test-phong03'" autocomplete="off" class="ng-pristine ng-untouched ng-valid ng-not-empty">

	            </div>

	                <span class="input-group-addon"><i class="zmdi zmdi-account"></i></span>
	                <div ng-class="{'has-error': loginForm.userId.$invalid &amp;&amp; loginForm.submitted}">
		                <div class="fg-line">
		                    <input set-focus="!login.userId" name="userId" type="text" class="form-control ng-pristine ng-untouched ng-empty ng-invalid ng-invalid-required" placeholder="아이디" ng-required="true" ng-model="login.userId" required="required">
		                </div>
	                </div>
	            </div>

	            <div class="invalid">

	            </div>
	            <div class="input-group m-b-20">
	                <span class="input-group-addon"><i class="zmdi zmdi-key"></i></span>
	                <div ng-class="{'has-error': loginForm.userPassword.$invalid &amp;&amp; loginForm.submitted}">
		                <div class="fg-line">
		                    <input set-focus="login.userId" type="password" name="userPassword" ng-model="login.userPassword" ng-required="true" class="form-control ng-pristine ng-untouched ng-empty ng-invalid ng-invalid-required" placeholder="비밀번호" autocomplete="off" required="required">
		                </div>
	                </div>
	            </div>

	            <div class="clearfix"></div>

	            <div class="checkbox">
	                <label class="ng-binding">
	                    <input name="isSaveId" type="checkbox" ng-model="login.isSaveId" class="ng-pristine ng-untouched ng-valid ng-empty">
